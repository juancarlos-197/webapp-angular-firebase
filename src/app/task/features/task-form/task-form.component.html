<div class="container text-center p-3 mb-2 bg-dark text-white ">
  <h4>Formulario de tareas!</h4>
</div>

<div class="container text-center">
  <div class="row p-3 mb-2 bg-success text-white  ">
    <div class="col">
    </div>
    <div class="col ">
      <form class="row" [formGroup]="formulario" (ngSubmit)="onSubmit()">
        <div class="col-12 ">
          <label for="validationDefault02" class="form-label">Título </label>
          <input type="text" class="form-control" id="validationDefault02" placeholder="Title" formControlName="title"
            required>
          <!-- @if (isRequired('email')) {
                        <div class="alert alert-danger" role="alert">
                            Este campo es requerido
                        </div>
                        }
                        @if (hasEmailError()) {
                        <div class="alert alert-danger" role="alert">
                            El correo debe ser valido </div>
                        }
                      -->
        </div>

        <div class="col-12">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" formControlName="completed" role="switch"
              id="switchCheckChecked" checked>
            <label class="form-check-label" for="switchCheckChecked">Completado</label>
          </div>
        </div>
        <div class="card-footer text-body-secondary">
          <br>
        </div>
        <div class="col-12">

          <button [disabled]="loadig()" class="btn btn-primary" type="submit">

            {{loadig() ? "Guardando...": "Guardar"}}

          </button>


        </div>

      </form>
    </div>
    <div class="col"></div>
  </div>
</div>
<br>
